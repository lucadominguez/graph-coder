name: checks

# The repository had no test workflow, which is how a quickstart pointing at a
# file that was never committed, and a contract identifier the docs said nothing
# wrote, both survived to a public push. Everything below runs locally too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range in pyproject.toml.
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Format
        run: python -m ruff format --check src tests scripts

      - name: Types
        run: python -m mypy

      - name: Tests
        run: python -m pytest -q
